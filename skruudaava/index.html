<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Päivän lounas | Kamppi</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #464646;
      --muted: #747474;
      --line: #e3e3e3;
      --paper: #fffbfa;
      --wash: #eff7f6;
      --coral: #f4a49d;
      --teal: #3fb6b6;
      --highlight: #e6f4f3;
      --error: #943c35;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: linear-gradient(180deg, var(--wash), var(--paper) 360px); min-height: 100vh; font: 16px/1.6 "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 0; }
    ::selection { color: var(--ink); background: var(--line); }
    main { max-width: 1200px; margin: auto; padding: 48px 28px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 28px; border-bottom: 2px solid var(--coral); }
    .eyebrow { color: var(--ink); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; margin: 0 0 4px; }
    #date { color: var(--muted); margin: 0; }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
    #restaurants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; padding-top: 30px; }
    article { min-width: 0; }
    .photo { width: 100%; height: 145px; object-fit: cover; background: var(--highlight); display: block; margin-bottom: 20px; }
    h2 { font-size: 18px; margin: 0 0 7px; overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: 0; }
    .hours { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    .status { color: var(--muted); font-size: 14px; margin: 18px 0; }
    .error { color: var(--error); }
    ul { list-style: none; margin: 0 0 18px; padding: 0; }
    li { padding: 13px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .category { display: block; color: var(--coral); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .details { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; }
    a { color: var(--coral); text-underline-offset: 4px; }
    a:hover { color: var(--teal); text-decoration-color: var(--teal); }
    .source, .status.fetched { font-size: 13px; }
    footer { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) {
      main { padding: 28px 20px 20px; }
      h1 { font-size: 36px; }
      header { flex-wrap: wrap; gap: 18px; }
      #restaurants { grid-template-columns: 1fr; gap: 36px; }
      .photo { height: 170px; }
    }
    @media (prefers-reduced-motion: no-preference) { article { animation: appear .3s ease-out; } @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Päivän lounas / Helsinki Kamppi</p><p id="date"></p></div>
    </header>
    <div id="restaurants"></div>
    <footer>Ruokalistat haetaan säännöllisesti ravintoloiden verkkosivuilta. Tietojen saatavuus ja ajantasaisuus riippuvat ravintolasta ja viimeisimmästä päivityksestä. Varmista allergeenit ravintolasta.</footer>
  </main>
  <script>
    const restaurants = [
      {
        id: 'palmia', name: 'Huippu 34', hours: 'Annankatu 34 / 11:00 - 13:30',
        source: 'https://www.palmia.fi/ravintola/ravintola-huippu-34/',
        image: 'https://www.palmia.fi/wp-content/uploads/2025/12/ravintola-huippu-34-lounaslinjasto-palmia.webp',
        parse: parsePalmia
      },
      {
        id: 'bierhaus', name: 'Bierhaus Kamppi', hours: 'Annanaukio 1 / 10:30 - 14:00',
        source: 'https://ardenrestaurants.fi/ravintolamme/bierhaus-kamppi/',
        menu: 'https://www.ardenrestaurants.fi/menut/BHkamppi/',
        image: 'https://ardenrestaurants.fi/wp-content/uploads/2025/10/IMG_3573-1-1500x965.jpg',
        parse: parseBierhaus
      },
      {
        id: 'bruuveri', name: 'Bruuveri', hours: 'Fredrikinkatu 63 / 10:30 - 14:30',
        source: 'https://bruuveri.fi/lounas/',
        image: 'https://bruuveri.fi/wp-content/uploads/2026/05/Bruuveri-og.jpg',
        parse: parseBruuveri
      }
    ];
    const weekdays = ['sunnuntai', 'maanantai', 'tiistai', 'keskiviikko', 'torstai', 'perjantai', 'lauantai'];
    const clean = element => element?.textContent.replace(/\s+/g, ' ').trim() || '';

    function helsinkiDate(now = new Date()) {
      const parts = new Intl.DateTimeFormat('fi-FI', {
        timeZone: 'Europe/Helsinki', year: 'numeric', month: 'numeric', day: 'numeric'
      }).formatToParts(now);
      const part = type => Number(parts.find(entry => entry.type === type).value);
      const date = new Date(Date.UTC(part('year'), part('month') - 1, part('day')));
      const thursday = new Date(date);
      thursday.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(thursday.getUTCFullYear(), 0, 1));
      return {
        day: part('day'), month: part('month'), year: part('year'),
        weekday: weekdays[date.getUTCDay()], weekend: [0, 6].includes(date.getUTCDay()),
        week: Math.ceil(((thursday - yearStart) / 86400000 + 1) / 7),
        label: new Intl.DateTimeFormat('fi-FI', { timeZone: 'Europe/Helsinki', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now)
      };
    }

    function matchesDate(text, today, requireYear = true) {
      const match = text.match(/\b(\d{1,2})\.(\d{1,2})\.?(?:(\d{4}))?(?!\d)/);
      return Boolean(match && Number(match[1]) === today.day && Number(match[2]) === today.month &&
        (match[3] ? Number(match[3]) === today.year : requireYear === false));
    }

    function parsePalmia(doc, today) {
      const day = [...doc.querySelectorAll('.aromi-menu-language-fi .aromi-menu-day')]
        .find(section => matchesDate(clean(section.querySelector('.aromi-menu-day-name')), today));
      if (day == null) return [];
      return [...day.querySelectorAll('.aromi-menu-day-meal__container')]
        .filter(section => section.closest('.aromi-popup') == null)
        .map(section => {
          const dishes = [...section.querySelectorAll('.aromi-menu-day-meal-name-list__wrapper')].map(row => {
            const diets = [...row.querySelectorAll('.diet-character')].map(clean).join(', ');
            return clean(row.querySelector('.aromi-menu-day-meal-name')) + (diets ? ' (' + diets + ')' : '');
          });
          return { category: clean(section.querySelector('.aromi-menu-meal-category')), name: dishes[0], details: dishes.slice(1).join('; ') };
        }).filter(dish => dish.name);
    }

    function parseBierhaus(doc, today) {
      const day = [...doc.querySelectorAll('.card-body')]
        .find(section => matchesDate(clean(section.querySelector('.description')), today));
      if (day == null) return [];
      return [...day.querySelectorAll('.item')].map(item => ({
        name: clean(item.querySelector('strong')),
        details: [...item.querySelectorAll('p')].filter(paragraph => paragraph.querySelector('strong') == null).map(clean).join(' ')
      })).filter(dish => dish.name);
    }

    function parseBruuveri(doc, today) {
      const heading = [...doc.querySelectorAll('p, h2, h3, h4')].find(element =>
        clean(element).toLocaleLowerCase('fi').startsWith(today.weekday + ' ') && matchesDate(clean(element), today, false));
      if (heading == null) return [];
      const elements = [...doc.body.querySelectorAll('*')];
      for (let index = elements.indexOf(heading) + 1; index < elements.length; index++) {
        const element = elements[index];
        if (element.tagName === 'UL') return [...element.querySelectorAll('li')].map(item => ({ name: clean(item) }));
        if (weekdays.some(day => clean(element).toLocaleLowerCase('fi').startsWith(day + ' ')) && /^(P|H[2-4])$/.test(element.tagName)) break;
      }
      return [];
    }

    function appendText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }

    function createSection(restaurant) {
      const article = document.createElement('article');
      article.id = restaurant.id;
      article.setAttribute('aria-labelledby', restaurant.id + '-title');
      const image = document.createElement('img');
      image.className = 'photo'; image.src = restaurant.image; image.alt = ''; image.referrerPolicy = 'no-referrer';
      image.addEventListener('error', () => image.hidden = true);
      article.append(image);
      appendText(article, 'h2', restaurant.name).id = restaurant.id + '-title';
      appendText(article, 'p', restaurant.hours, 'hours');
      const content = document.createElement('div');
      content.setAttribute('aria-live', 'polite');
      article.append(content);
      const source = appendText(article, 'a', 'Ravintolan ruokalista', 'source');
      source.href = restaurant.menu || restaurant.source;
      source.target = '_blank'; source.rel = 'noopener noreferrer';
      document.querySelector('#restaurants').append(article);
      return content;
    }

    const sections = new Map(restaurants.map(restaurant => [restaurant.id, createSection(restaurant)]));

    async function fetchMenuHtml(restaurant) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch('./data/' + restaurant.id + '.json', {
          signal: controller.signal, credentials: 'omit', cache: 'no-store'
        });
        if (response.ok === false) throw new Error('HTTP ' + response.status);
        const menu = await response.json();
        if (menu.source !== (restaurant.menu || restaurant.source) ||
            typeof menu.html !== 'string' || /<(?:html|body|div|p|ul)\b/i.test(menu.html) === false ||
            typeof menu.fetchedAt !== 'string' || Number.isNaN(Date.parse(menu.fetchedAt))) {
          throw new Error('Invalid cached menu');
        }
        return menu;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function loadRestaurant(restaurant, today) {
      const content = sections.get(restaurant.id);
      content.replaceChildren();
      if (today.weekend) {
        appendText(content, 'p', 'Ei arkilounasta tänään.', 'status');
        return;
      }
      appendText(content, 'p', 'Haetaan päivän ruokalistaa...', 'status');
      content.setAttribute('aria-busy', 'true');
      try {
        const menu = await fetchMenuHtml(restaurant);
        const doc = new DOMParser().parseFromString(menu.html, 'text/html');
        const dishes = restaurant.parse(doc, today);
        content.replaceChildren();
        if (dishes.length === 0) {
          appendText(content, 'p', 'Tälle päivälle ei löytynyt ruokalistaa. Tarkista ravintolan oma ruokalista.', 'status');
          return;
        }
        const list = document.createElement('ul');
        for (const dish of dishes) {
          const item = document.createElement('li');
          if (dish.category) appendText(item, 'span', dish.category, 'category');
          appendText(item, 'span', dish.name);
          if (dish.details) appendText(item, 'span', dish.details, 'details');
          list.append(item);
        }
        content.append(list);
        appendText(content, 'p', 'Haettu ' + new Intl.DateTimeFormat('fi-FI', { timeZone: 'Europe/Helsinki', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(menu.fetchedAt)) + ' Suomen aikaa', 'status fetched');
      } catch {
        content.replaceChildren();
        appendText(content, 'p', 'Ruokalistan viimeisin päivitys ei ole saatavilla. Avaa ravintolan oma ruokalista tai yritä myöhemmin uudelleen.', 'status error');
      } finally {
        content.setAttribute('aria-busy', 'false');
      }
    }

    let isRefreshing = false;

    async function refresh() {
      if (isRefreshing) return;
      isRefreshing = true;
      const today = helsinkiDate();
      document.querySelector('#date').textContent = today.label;
      try { await Promise.all(restaurants.map(restaurant => loadRestaurant(restaurant, today))); }
      finally { isRefreshing = false; }
    }

    refresh();
  </script>
</body>
</html>
