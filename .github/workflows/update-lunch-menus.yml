name: Update Lunch Menus and Deploy Pages

on:
  schedule:
    - cron: '17,47 5-14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore previous menus
        uses: actions/cache@v4
        with:
          path: skruudaava/data
          key: lunch-menus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lunch-menus-
      - name: Fetch restaurant menus
        run: python skruudaava/fetch_menus.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4